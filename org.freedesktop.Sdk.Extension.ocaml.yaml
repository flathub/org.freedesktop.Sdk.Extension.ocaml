# flatpak-builder --force-clean build-dir org.freedesktop.Sdk.Extension.ocaml.yaml
# flatpak-builder --user --install --force-clean build-dir org.freedesktop.Sdk.Extension.ocaml.yaml
id: org.freedesktop.Sdk.Extension.ocaml
branch: "25.08"
runtime: org.freedesktop.Sdk
build-extension: true
sdk: org.freedesktop.Sdk
runtime-version: "25.08"
separate-locales: false
appstream-compose: false
build-options:
  append-path: /usr/lib/sdk/ocaml/bin
  prefix: /usr/lib/sdk/ocaml

modules:
  - name: rsync
    buildsystem: autotools
    config-opts:
      - "--disable-xxhash"
    sources:
      - type: archive
        url: https://download.samba.org/pub/rsync/src/rsync-3.4.1.tar.gz
        sha256: 2924bcb3a1ed8b551fc101f740b9f0fe0a202b115027647cf69850d65fd88c52

  - name: opam
    buildsystem: simple
    sources:
      - type: file
        dest-filename: opam
        only-arches:
          - x86_64
        url: https://github.com/ocaml/opam/releases/download/2.4.1/opam-2.4.1-x86_64-linux
        sha256: 30da8eb20c8f4cfd3818db867d85f26df1ca5ca27cb25910c0235c5a02e12d3b
      - type: file
        dest-filename: opam
        only-arches:
          - aarch64
        url: https://github.com/ocaml/opam/releases/download/2.4.1/opam-2.4.1-arm64-linux
        sha256: cbfa6d5c1869715a9e3454879d59e0f32a020a3224bbbc43eb9ddb3a069813ee
    build-commands:
      - chmod +x opam
      - mv opam* ${FLATPAK_DEST}/bin

  - name: appdata
    buildsystem: simple
    build-commands:
      - install -Dm0644 org.freedesktop.Sdk.Extension.ocaml.appdata.xml -t ${FLATPAK_DEST}/share/metainfo
    sources:
      - type: file
        path: org.freedesktop.Sdk.Extension.ocaml.appdata.xml
